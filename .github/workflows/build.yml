name: Build xdos image
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install NASM
        run: sudo apt-get install -y nasm
      - name: Build xdos
        run: |
          cd tools && python3 mkassets.py && cd ..
          nasm -f bin -Iinclude/ -Ikernel/ -Ikernel/apps/ -Ikernel/net/ -Iout/ kernel/kernel.asm -o out/kernel.bin
          python3 tools/pack.py 2>&1 || true
          # Run build.py but with NASM env override
          NASM=/usr/bin/nasm python3 tools/build.py 2>&1 | tail -20
          ls -la out/os.img
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xdos-image
          path: out/os.img
